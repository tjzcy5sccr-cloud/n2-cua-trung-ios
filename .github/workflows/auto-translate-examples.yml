name: Auto translate Japanese examples using main Vietnamese gloss
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-translate-examples.yml'
permissions:
  contents: write
concurrency:
  group: n2-auto-translate-examples
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Count missing translations without machine learning
        run: python3 scripts/auto_translate_examples.py
      - name: Install CPU-only Marian Japanese to Vietnamese translator
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install 'transformers==4.46.3' 'sentencepiece>=0.2,<0.3' 'sacremoses>=0.1,<0.2' 'protobuf>=4.25,<6'
      - name: Translate whole Japanese sentences using focal word meanings
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python3 scripts/auto_translate_examples.py --apply
      - name: Validate every translation status and preserve manually corrected text
        run: |
          python3 scripts/check_translation_quality.py
          python3 scripts/audit_all_course_content.py
      - name: Upload detailed Japanese-Vietnamese quality inventory
        uses: actions/upload-artifact@v4
        with:
          name: N2-sentence-machine-translation-audit
          path: qa-reports/n2-content-audit.json
          if-no-files-found: error
      - name: Commit generated example translations and versioned pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "N2 of Trung Example Translation"
          git config user.email "n2-example-translation@users.noreply.github.com"
          git add content-packs/openjlpt-n2-core.json content-packs/manifest.json content-packs/N2_VI_TRANSLATION_QA.json
          if git diff --cached --quiet; then
            echo "No new translations generated."
          else
            git commit -m "i18n: machine translate N2 examples with primary gloss review warnings"
            git push origin HEAD:main
          fi
