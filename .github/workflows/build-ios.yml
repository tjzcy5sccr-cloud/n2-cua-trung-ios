name: Build Native iOS IPA (unsigned)
"on":
  workflow_dispatch:
    inputs:
      preview_approved:
        description: "Da xem va duyet anh giao dien truoc khi build IPA?"
        type: boolean
        required: true
        default: false
      preview_commit:
        description: "Nhap SHA commit da xem preview (40 ky tu). Bat buoc khop commit build."
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: n2-iphone-main-build
  cancel-in-progress: true
jobs:
  build-ios:
    if: ${{ inputs.preview_approved == true }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Require approval of the exact previewed commit
        shell: bash
        env:
          PREVIEW_SHA: ${{ inputs.preview_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Preview approval requires full 40-character commit SHA."
            exit 1
          fi
          if [ "$PREVIEW_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Preview SHA differs from source being built. Review a new preview first."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for offline Japanese Furigana
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all course packages, grammar and example translations
        run: python3 scripts/audit_all_course_content.py
      - name: Upload full Japanese-Vietnamese review inventory
        uses: actions/upload-artifact@v4
        with:
          name: N2-translation-audit-report
          path: |
            qa-reports/n2-content-audit.json
            qa-reports/n2-untranslated-audit.json
          if-no-files-found: error
      - name: Validate Vietnamese glossary and 214 radical table
        run: python3 scripts/check_translation_quality.py
      - name: Keep unchecked meanings and examples only in GitHub source
        run: python3 scripts/prepare_approved_app_resources.py
      - name: Build full Japanese Furigana atlas (dictionary-based)
        run: |
          python -m pip install --disable-pip-version-check 'fugashi[unidic-lite]'
          python scripts/generate_furigana_atlas.py --strict
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Draw the clover app icon
        run: swift scripts/generate_clover_icon.swift
      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml
      - name: Compile iPhone app (without code signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project N2CuaTrung.xcodeproj \
            -scheme N2CuaTrung -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build | tee xcodebuild.log
      - name: Validate Live Activities in IPA payload
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/N2CuaTrung.app"
          test -f "$APP/Info.plist"
          echo "Live Activities Info.plist:"
          LIVE_VALUE=$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")
          echo "$LIVE_VALUE"
          test "$LIVE_VALUE" = "true"
          WIDGET=$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -quit)
          test -n "$WIDGET"
          WIDGET_TYPE=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET/Info.plist")
          echo "Widget extension type: $WIDGET_TYPE"
          test "$WIDGET_TYPE" = 'com.apple.widgetkit-extension'
          echo "PASS: Live Activities enabled and Widget Extension packaged."
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          test -d build/Build/Products/Release-iphoneos/N2CuaTrung.app
          cp -R build/Build/Products/Release-iphoneos/N2CuaTrung.app Payload/
          zip -qry N2_cua_Trung_unsigned.ipa Payload
          unzip -l N2_cua_Trung_unsigned.ipa | head -25
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: N2-cua-Trung-iOS-unsigned-IPA
          path: N2_cua_Trung_unsigned.ipa
          if-no-files-found: error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: N2-cua-Trung-build-log
          path: xcodebuild.log
          if-no-files-found: ignore