name: Verify Sou Matome private library
"on":
  push:
    branches:
      - feature/n2-sou-matome-library-2026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 5 books, 3 supporting PDFs and CD track coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('research/sou-matome/source-catalog.json').read_text(encoding='utf-8'))
          books = d['documents']
          assert len(books) == 8
          assert len([b for b in books if b['sectionType'] != 'supplement']) == 5
          assert len([b for b in books if b['sectionType'] == 'supplement']) == 3
          assert sum(b['pages'] for b in books) == 1239
          assert all(0 < p <= b['pages'] for b in books for p in b['sectionStarts'])
          assert sum(cd['mp3Count'] for cd in d['listeningCDs']) == 116
          assert all(cd['trackEnd'] - cd['trackStart'] + 1 == cd['mp3Count'] for cd in d['listeningCDs'])
          coverage=json.loads(Path('qa-reports/sou-matome-source-coverage.json').read_text(encoding='utf-8'))
          assert coverage['totalPageCount'] == 1239
          assert coverage['primaryTextbookPages'] == 683
          assert coverage['supplementTextPages'] == 556
          assert sum(d['textLayerPages'] for d in coverage['sourceDocuments']) == 556
          assert coverage['lessonContentCompleteness'].startswith('NOT COMPLETE')
          print('PASS: metadata catalog: 8 PDFs, 1,239 pages, 116 MP3 tracks')
          PY
      - name: Verify whole-book page catalog and no active weekly partitions
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path('content-packs/sou-matome-full-book-page-index.json').read_text(encoding='utf-8'))
          assert d['weeklyPartitioning'] is False
          assert d['displayMode']=='whole_books'
          assert len(d['pages'])==1239
          assert len({x['id'] for x in d['pages']})==1239
          counts=Counter(x['bookId'] for x in d['pages'])
          assert counts=={b['id']:b['pages'] for b in d['books']}
          assert not any('week' in page for page in d['pages'])
          assert len([p for p in d['pages'] if p['sourceText']=='searchable_pdf'])==556
          assert len([p for p in d['pages'] if p['sourceText']=='scanned_image'])==683
          print('PASS: full 1239-page catalog, five skill library, no weekly partitioning')
          PY
      - name: Check Swift source syntax
        run: |
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomeLibraryView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomePageWorkbenchView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomeDailyNavigatorView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomeWholeBooksView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomeSourceEntriesView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/SouMatomePersonalReview.swift
          swiftc -frontend -parse N2CuaTrung/Sources/LearningSeriesPickerView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/DashboardView.swift
          swiftc -frontend -parse N2CuaTrung/Sources/ContentUpdates.swift
      - name: Test reviewed-only Japanese-Vietnamese content audit
        run: |
          python3 -m py_compile scripts/audit_sou_matome_personal_pack.py scripts/extract_sou_matome_private_candidates.py
          python3 -m unittest discover -s scripts -p 'test_sou_matome_audit.py' -v
      - name: Test extraction without commercial textbook data
        run: |
          python3 -m pip install --disable-pip-version-check 'PyMuPDF>=1.23,<2'
          python3 -m unittest discover -s scripts -p 'test_sou_matome_extractor.py' -v
      - name: Execute native Swift multiple-choice regression
        run: |
          swiftc N2CuaTrung/Sources/Models.swift scripts/test_sou_matome_question_bank.swift -o /tmp/sou-matome-quiz-tests
          /tmp/sou-matome-quiz-tests
      - name: Validate independent study packs
        run: |
          python3 scripts/validate_sou_matome_quiz_quality.py
          python3 scripts/validate_series_packs.py
          python3 scripts/validate_four_series_curriculum.py
