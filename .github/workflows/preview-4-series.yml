name: Preview original N2 four-series curriculum
"on":
  push:
    branches:
      - feature/n2-four-series-roadmap-2027
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n2-four-series-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  content-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Validate 35-week syllabus and all 4 independent content packs
        run: |
          python3 scripts/validate_four_series_curriculum.py
          python3 scripts/validate_series_packs.py
          python3 scripts/validate_original_batch03.py
          python3 -m py_compile scripts/import_original_n2_batch02.py scripts/import_original_n2_batch03.py scripts/prepare_approved_app_resources.py scripts/validate_ipa_content.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("qa-reports/n2-original-batch-02.json").read_text(encoding="utf-8"))
          assert audit["added"]=={"vocab":64,"grammar":12,"kanji":16,"readings":4,"listening":4}
          assert all(x["version"]>=4 for x in audit["series"].values())
          third=json.loads(Path("qa-reports/n2-original-batch-03.json").read_text(encoding="utf-8"))
          assert third["added"]=={"vocab":64,"grammar":12,"kanji":16,"readings":4,"listening":4}
          assert all(x["version"]>=5 for x in third["series"].values())
          assert third["newlyImportedThisRun"]=={"vocab":0,"grammar":0,"kanji":0,"readings":0,"listening":0}
          print("PASS: all 274 original entries across batches 01–03, four v6 datasets, stable historical audit and no IPA build")
          PY
      - name: Parse curriculum Swift code without compiling iOS
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse N2CuaTrung/Sources/FourSeriesCurriculumView.swift
            swiftc -frontend -parse N2CuaTrung/Sources/LearningSeries.swift
            swiftc -frontend -parse N2CuaTrung/Sources/LearningSeriesPickerView.swift
            swiftc -frontend -parse N2CuaTrung/Sources/StudyStore.swift
            swiftc -frontend -parse N2CuaTrung/Sources/ContentUpdates.swift
            swiftc -frontend -parse N2CuaTrung/Sources/ContentUpdatesView.swift
            swiftc -frontend -parse N2CuaTrung/Sources/Models.swift
            swiftc -frontend -parse N2CuaTrung/Sources/QuizView.swift
          else
            echo "Swift compiler unavailable on this Linux runner; data validation still applies."
          fi
      - name: Install Japanese Unicode font and preview renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Render both curriculum and data-series selector mockups
        run: |
          python3 scripts/render_four_series_preview.py
          python3 scripts/render_series_selector_preview.py
      - name: Upload preview and syllabus for review
        uses: actions/upload-artifact@v4
        with:
          name: N2-four-series-35-week-preview-${{ github.sha }}
          path: |
            qa-reports/four-series-prebuild-preview.png
            qa-reports/series-selector-preview.png
            N2CuaTrung/Resources/n2-four-series-curriculum.json
          if-no-files-found: error
          retention-days: 30
