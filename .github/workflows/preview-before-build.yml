name: Preview iOS screens before IPA build
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n2-layout-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prebuild-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact preview revision
        uses: actions/checkout@v4
      - name: Install Japanese Unicode fonts for true Kanji/Kana preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install lightweight illustration dependencies
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Draw vocabulary front/back, Kanji and grammar previews
        run: python3 scripts/render_prebuild_preview.py
      - name: Upload images and commit metadata for user approval
        uses: actions/upload-artifact@v4
        with:
          name: N2-prebuild-preview-${{ github.sha }}
          path: |
            qa-reports/prebuild-preview.png
            qa-reports/prebuild-preview.json
          if-no-files-found: error
          retention-days: 30
