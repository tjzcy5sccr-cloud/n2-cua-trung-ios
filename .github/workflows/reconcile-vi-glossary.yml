name: Reconcile Vietnamese N2 glossary from licensed dictionary
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-vi-glossary.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read and report matching licensed Japanese-Vietnamese entries
        run: python3 scripts/reconcile_open_jv_dictionary.py
      - name: Add only source-attributed unverified dictionary candidates
        run: python3 scripts/reconcile_open_jv_dictionary.py --apply
      - name: Verify version, preserved reviewed entries and 214 radicals
        run: python3 scripts/check_translation_quality.py
      - name: Publish candidate glossary without changing card IDs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "N2 of Trung VN Dictionary QA"
          git config user.email "n2-course-qa@users.noreply.github.com"
          git add content-packs/openjlpt-n2-core.json content-packs/manifest.json content-packs/N2_VI_TRANSLATION_QA.json
          if git diff --cached --quiet; then
             echo "No candidate changes; nothing to publish."
          else
             git commit -m "dictionary: source-attributed Vietnamese candidates (not verified)"
             git push origin HEAD:main
          fi
