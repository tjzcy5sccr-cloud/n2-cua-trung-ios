name: Translate N2 teaching data to Vietnamese (open-source MT)
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/translate_n2_to_vietnamese.py'
      - '.github/workflows/translate-n2-vi.yml'
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.44.2' 'sentencepiece>=0.2,<0.3' 'sacremoses>=0.1'
      - name: Audit number of fields to translate
        run: python scripts/translate_n2_to_vietnamese.py --check-only
      - name: Translate into Vietnamese using Apache-licensed models
        run: python scripts/translate_n2_to_vietnamese.py --threads 4
      - name: Publish translated Vietnamese course data
        run: |
          git config user.name 'N2 Trung Translation Bot'
          git config user.email 'n2-course-translator@users.noreply.github.com'
          git add content-packs/openjlpt-n2-core.json content-packs/manifest.json content-packs/N2_VI_TRANSLATION_QA.json
          git commit -m 'content: Vietnamese N2 corpus generated; mark machine translations for review' || exit 0
          git push origin HEAD:main
      - name: Build updated iOS app after translation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ios.yml --ref main