name: N2CuaTrung
options:
  bundleIdPrefix: vn.trung
  deploymentTarget:
    iOS: '16.2'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.2'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'N2 của Trung'
    INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright © 2026 Trần Phước Trung. All rights reserved.'
    MARKETING_VERSION: '1.9.2'
    CURRENT_PROJECT_VERSION: '12'
    INFOPLIST_KEY_CFBundleDevelopmentRegion: vi
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: vn.trung.n2master2027
    INFOPLIST_KEY_NSSupportsLiveActivities: YES
targets:
  N2CuaTrung:
    type: application
    platform: iOS
    deploymentTarget: '16.2'
    sources:
      - path: N2CuaTrung/Sources
      - path: N2CuaTrung/Resources/content.json
        buildPhase: resources
      - path: N2CuaTrung/Resources/n2-four-series-curriculum.json
        buildPhase: resources
      - path: N2CuaTrung/Resources/grammar-details.json
        buildPhase: resources
      - path: N2CuaTrung/Resources/furigana-atlas.json
        buildPhase: resources
      - path: content-packs/n2-expansion-01.json
        buildPhase: resources
      - path: content-packs/openjlpt-n2-core.json
        buildPhase: resources
      - path: content-packs/vn26-original-practice-01.json
        buildPhase: resources
      - path: content-packs/n2-reading-listening-02.json
        buildPhase: resources
      - path: content-packs/n2-series-mimikara.json
        buildPhase: resources
      - path: content-packs/n2-series-shin-kanzen.json
        buildPhase: resources
      - path: content-packs/n2-series-sou-matome.json
        buildPhase: resources
      - path: content-packs/n2-series-speed-master.json
        buildPhase: resources
      - path: N2CuaTrung/Assets.xcassets
    dependencies:
      - target: N2WidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: N2CuaTrung
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
  N2WidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.2'
    sources:
      - path: N2Widget/N2WordWidget.swift
      - path: N2CuaTrung/Sources/StudyActivityAttributes.swift
      - path: N2CuaTrung/Resources/content.json
        buildPhase: resources
      - path: content-packs/n2-expansion-01.json
        buildPhase: resources
      - path: content-packs/openjlpt-n2-core.json
        buildPhase: resources
      - path: content-packs/vn26-original-practice-01.json
        buildPhase: resources
    info:
      path: N2Widget/WidgetInfo.plist
      properties:
        CFBundleDisplayName: 'N2 của Trung Widget'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.trung.n2master2027.widget
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES