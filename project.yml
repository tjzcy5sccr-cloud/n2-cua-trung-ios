name: N2CuaTrung
options:
  bundleIdPrefix: vn.trung
  deploymentTarget:
    iOS: '16.0'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'N2 của Trung'
    INFOPLIST_KEY_NSHumanReadableCopyright: 'Copyright © 2026 Trần Phước Trung. All rights reserved.'
    MARKETING_VERSION: '1.2.0'
    CURRENT_PROJECT_VERSION: '3'
    INFOPLIST_KEY_CFBundleDevelopmentRegion: vi
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    PRODUCT_BUNDLE_IDENTIFIER: vn.trung.n2master2027
targets:
  N2CuaTrung:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: N2CuaTrung/Sources
      - path: N2CuaTrung/Resources/content.json
        buildPhase: resources
      - path: N2CuaTrung/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: N2CuaTrung
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO